<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route Optimization</title>
  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.1.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

  <div class="container mx-auto p-6 max-w-xl bg-white shadow-lg rounded-lg mt-10">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Route Optimization</h1>

    <!-- Source Input -->
    <div class="mb-4">
      <label for="source" class="block text-gray-700 font-semibold mb-2">Source</label>
      <input type="text" id="source" placeholder="Enter Source" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Destination Input -->
    <div class="mb-4">
      <label for="destination" class="block text-gray-700 font-semibold mb-2">Destination</label>
      <input type="text" id="destination" placeholder="Enter Destination" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Time Selection -->
    <div class="mb-4">
      <label for="time" class="block text-gray-700 font-semibold mb-2">Select Time</label>
      <input type="time" id="time" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>

    <!-- Current Time Button -->
    <button onclick="setCurrentTime()" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 mb-4">Use Current Time</button>

    <!-- Route Optimization Button -->
    <button onclick="findBestRoute()" class="w-full bg-green-500 text-white py-2 rounded-md hover:bg-green-600 mb-4">Optimize Route</button>

    <!-- Output Text Box -->
    <div class="mt-4">
      <label class="block text-gray-700 font-semibold mb-2">Route Details</label>
      <div id="output" class="p-4 bg-gray-50 rounded-md"></div>
    </div>
  </div>

  <script>
    const data = [
        { route: "T11 G", source: "VELLORE", time_start: "07:00:00", destination: "A.K.PADAVEDU", time_end: "08:20:00", distance: 39.8, stops: ["Adukamparai", "kannamangalam", "Santhavasal"] },
        { route: "T11 G", source: "VELLORE", time_start: "14:20:00", destination: "A.K.PADAVEDU", time_end: "15:40:00", distance: 39.8, stops: ["Adukamparai", "kannamangalam", "Santhavasal"] },
        { route: "T11 G", source: "VELLORE", time_start: "18:45:00", destination: "A.K.PADAVEDU", time_end: "20:05:00", distance: 39.8, stops: ["Adukamparai", "kannamangalam", "Santhavasal"] }
    ];

    function setCurrentTime() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('time').value = `${hours}:${minutes}`;
    }

    function findBestRoute() {
        const source = document.getElementById('source').value.toUpperCase();
        const destination = document.getElementById('destination').value.toUpperCase();
        const timeInput = document.getElementById('time').value;

        if (!timeInput) {
            document.getElementById('output').innerHTML = "<p class='text-red-500 font-bold'>Please select a time.</p>";
            return;
        }

        const [inputHours, inputMinutes] = timeInput.split(":").map(Number);
        const inputTime = new Date();
        inputTime.setHours(inputHours, inputMinutes, 0, 0);

        const matchingRoutes = data.filter(d => d.source === source && d.destination === destination);

        if (matchingRoutes.length === 0) {
            document.getElementById('output').innerHTML = "<p class='text-red-500 font-bold'>No available route for the selected source and destination.</p>";
            return;
        }

        let nearestRoute = null;
        let minTimeDifference = Infinity;

        matchingRoutes.forEach(d => {
            const [routeHours, routeMinutes, routeSeconds] = d.time_start.split(":").map(Number);
            const routeTime = new Date();
            routeTime.setHours(routeHours, routeMinutes, routeSeconds, 0);

            const timeDifference = routeTime - inputTime;
            if (timeDifference >= 0 && timeDifference < minTimeDifference) {
                minTimeDifference = timeDifference;
                nearestRoute = d;
            }
        });

        if (!nearestRoute) {
            document.getElementById('output').innerHTML = "<p class='text-red-500 font-bold'>No available route at or after the selected time.</p>";
            return;
        }

        const distance = nearestRoute.distance;
        const fare = (distance * 0.58).toFixed(2);
        const timeStart = nearestRoute.time_start;
        const traffic = getTrafficCondition(calculateDuration(timeStart, nearestRoute.time_end), distance);

        const bestRouteDetails = `
            <div class="border-2 border-green-500 p-4 mb-4 rounded-md">
                <h2 class="text-xl font-bold text-green-600 mb-2">BEST ROUTE</h2>
                <p class="font-bold">Route: <a href="https://www.google.com/maps/dir/?api=1&origin=${source}&destination=${destination}&waypoints=${nearestRoute.stops.join('|')}" target="_blank" class="text-blue-500 hover:underline">${source} -> ${nearestRoute.stops.join(' -> ')} -> ${destination}</a></p>
                <p class="font-bold">Distance: ${distance} km</p>
                <p class="font-bold">Time: ${timeStart}</p>
                <p class="font-bold">Traffic: ${traffic}</p>
                <p class="font-bold">Bus Fare: Rs ${fare}</p>
            </div>`;

        const secondRouteDetails = `
            <div class="border-2 border-blue-500 p-4 rounded-md">
                <h2 class="text-xl font-bold text-blue-600 mb-2">SECOND BEST ROUTE</h2>
                <p class="font-bold">Route: <a href="https://www.google.com/maps/dir/?api=1&origin=${source}&destination=${destination}&waypoints=kaniyambadi|Puthur" target="_blank" class="text-blue-500 hover:underline">${source} -> kaniyambadi -> Puthur -> ${destination}</a></p>
                <p class="font-bold">Distance: ${distance} km</p>
                <p class="font-bold">Time: ${timeStart}</p>
                <p class="font-bold">Traffic: ${traffic}</p>
                <p class="font-bold">Bus Fare: Rs ${fare}</p>
            </div>`;

        document.getElementById('output').innerHTML = bestRouteDetails + secondRouteDetails;
    }

    function calculateDuration(start, end) {
        const [startHours, startMinutes] = start.split(":").map(Number);
        const [endHours, endMinutes] = end.split(":").map(Number);
        const startDate = new Date();
        const endDate = new Date();
        startDate.setHours(startHours, startMinutes, 0, 0);
        endDate.setHours(endHours, endMinutes, 0, 0);
        return (endDate - startDate) / 60000; // Duration in minutes
    }

    function getTrafficCondition(duration, distance) {
        const speed = distance / (duration / 60); // speed in km/h
        if (speed < 30) return "High";
        if (speed <= 50) return "Medium";
        return "Low";
    }
  </script>
</body>
</html>
