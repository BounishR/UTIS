<!DOCTYPE html>
<html>
<head>
  <title>Route Optimiser</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
        background-color: #f9fafb; /* White Background */
        font-family: 'Roboto', sans-serif; /* Google Roboto Font */
    }
    .container {
        background-color: #ffffff; /* White Container */
        border: 1px solid #e5e7eb; /* Light Gray Border */
    }
    .title, .section-title {
        color: #4f46e5; /* Indigo Text */
    }
    .input-field label, .route-info {
        color: #374151; /* Dark Gray Text */
    }
    .btn-primary {
        background-color: #6366f1; /* Indigo Button */
        color: #fff; /* White Text */
    }
    .btn-primary:hover {
        background-color: #4f46e5; /* Darker Indigo Hover */
    }
    .btn-secondary {
        background-color: #3b82f6; /* Blue Button */
        color: #fff; /* White Text */
        font-size: 0.875rem; /* Reduced Font Size */
    }
    .btn-secondary:hover {
        background-color: #2563eb; /* Darker Blue Hover */
    }
    .input-group {
        display: flex;
        align-items: center;
    }
    .input-group input[type="time"] {
        flex: 1;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
<div class="container p-8 rounded-lg shadow-lg w-full max-w-2xl">
  <h1 class="title text-2xl font-bold mb-6 text-center">Route Optimiser</h1>
  <div class="space-y-4">
    <div class="input-field flex flex-col">
      <label for="source" class="mb-2"><i class="fas fa-map-marker-alt mr-2"></i>Source:</label>
      <input type="text" id="source" name="source" class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500">
    </div>
    <div class="input-field flex flex-col">
      <label for="destination" class="mb-2"><i class="fas fa-map-marker-alt mr-2"></i>Destination:</label>
      <input type="text" id="destination" name="destination" class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500">
    </div>
    <div class="input-field flex flex-col">
      <label for="time" class="mb-2"><i class="fas fa-clock mr-2"></i>Time:</label>
      <div class="input-group">
        <input type="time" id="time" name="time" class="px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500">
        <button onclick="useCurrentTime()" class="btn-secondary ml-2 px-4 py-2 rounded-md">Use Current Time</button>
      </div>
    </div>
    <button onclick="routeOptimise()" class="btn-primary w-full mt-4 px-4 py-2 rounded-md">Route Optimise</button>
  </div>
  <div class="result-section mt-8 hidden" id="results">
    <h2 class="section-title text-xl font-semibold" id="best-route-title"><i class="fas fa-road mr-2"></i>Best Route</h2>
    <div class="route-info mt-2 p-4 bg-gray-100 rounded-md" id="best-route"></div>
    <h2 class="section-title text-xl font-semibold mt-6" id="other-route-title"><i class="fas fa-road mr-2"></i>Other Route</h2>
    <div class="route-info mt-2 p-4 bg-gray-100 rounded-md" id="other-route"></div>
    <div class="route-info mt-2 p-4 bg-gray-100 rounded-md hidden" id="no-route">No direct buses available to optimise.</div>
  </div>
</div>

<script>
  const route1 = [
      {route: "T10DB", source: "VELLORE", sourceTime: "21:50:00", destination: "66 PUTHUR", destinationTime: "22:00:00", distance: 31, waypoints: ["Sathuvacheri", "Arapakkam", "Melvisharam"]},
      {route: "T11 G", source: "VELLORE", sourceTime: "07:00:00", destination: "A.K.PADAVEDU", destinationTime: "08:20:00", distance: 39.8, waypoints: ["Sathuvacheri", "Arapakkam", "Melvisharam"]},


  ];

  const route2 = [
      {route: "T10DB", source: "VELLORE", sourceTime: "21:50:00", destination: "66 PUTHUR", destinationTime: "22:00:00", distance: 17.9, waypoints: ["Katpadi", "Sevur", "Arumparthi"]},
      {route: "T11 G", source: "VELLORE", sourceTime: "07:00:00", destination: "A.K.PADAVEDU", destinationTime: "08:20:00", distance: 34.4, waypoints: ["Adumkamparai", "Kaniyambadi", "Pudhur"]},
      // ... add more route 2 data here
  ];

  function useCurrentTime() {
      const now = new Date();
      const timeString = now.toTimeString().split(' ')[0].slice(0, 5);
      document.getElementById('time').value = timeString;
  }

  function getRandomTraffic() {
      const trafficLevels = ["high", "medium", "slightly medium", "slightly high", "very high", "low"];
      return trafficLevels[Math.floor(Math.random() * trafficLevels.length)];
  }

  function calculateFare(distance) {
      return Math.round(distance * 0.58);
  }



  function generateGoogleMapsLink(route, waypoints) {
      const waypointsParam = waypoints.map(point => point.replace(/\s/g, '+')).join('|');
      return `https://www.google.com/maps/dir/${route.source.replace(/\s/g, '+')}/${waypointsParam}/${route.destination.replace(/\s/g, '+')}`;
  }

  function routeOptimise() {
const source = document.getElementById('source').value.toUpperCase();
const destination = document.getElementById('destination').value.toUpperCase();

const bestRoute = route1.find(route => route.source === source && route.destination === destination);
const otherRoute = route2.find(route => route.source === source && route.destination === destination);

const bestRouteElement = document.getElementById('best-route');
const otherRouteElement = document.getElementById('other-route');
const noRouteElement = document.getElementById('no-route');

if (!bestRoute && !otherRoute) {
  noRouteElement.classList.remove('hidden');
  bestRouteElement.classList.add('hidden');
  otherRouteElement.classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  return;
}

noRouteElement.classList.add('hidden');

if (bestRoute) {
  const bestRouteTime = bestRoute.sourceTime;
  const bestRouteTraffic = getRandomTraffic();
  const bestRouteFare = calculateFare(bestRoute.distance);
  const bestRouteLink = generateGoogleMapsLink(bestRoute, bestRoute.waypoints);

  bestRouteElement.innerHTML = `
      <b>Route</b>: <a href="${bestRouteLink}" target="_blank" class="text-blue-500 underline">${bestRoute.source} -> ${bestRoute.waypoints.join(' -> ')} -> ${bestRoute.destination}</a><br>
      <b>Distance</b>: ${bestRoute.distance} km<br>
      <b>Time</b>: ${bestRouteTime}<br>
      <b>Traffic</b>: ${bestRouteTraffic}<br>
      <b>Bus Fare</b>: ₹${bestRouteFare}
  `;
  bestRouteElement.classList.remove('hidden');
} else {
  bestRouteElement.classList.add('hidden');
}

if (otherRoute) {
  const otherRouteTime = otherRoute.sourceTime;
  const otherRouteTraffic = getRandomTraffic();
  const otherRouteFare = calculateFare(otherRoute.distance);
  const otherRouteLink = generateGoogleMapsLink(otherRoute, otherRoute.waypoints);

  otherRouteElement.innerHTML = `
      <b>Route</b>: <a href="${otherRouteLink}" target="_blank" class="text-blue-500 underline">${otherRoute.source} -> ${otherRoute.waypoints.join(' -> ')} -> ${otherRoute.destination}</a><br>
      <b>Distance</b>: ${otherRoute.distance} km<br>
      <b>Time</b>: ${otherRouteTime}<br>
      <b>Traffic</b>: ${otherRouteTraffic}<br>
      <b>Bus Fare</b>: ₹${otherRouteFare}
  `;
  otherRouteElement.classList.remove('hidden');
} else {
  otherRouteElement.classList.add('hidden');
}
document.getElementById('results').classList.remove('hidden');
}
</script>
</body>
</html>
